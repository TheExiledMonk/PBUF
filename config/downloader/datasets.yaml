datasets:
  bao_aniso:
    url: https://data.sdss.org/sas/dr12/boss/papers/clustering/BAO_consensus_boss_dr12.json
    notes: >-
      BOSS DR12 consensus BAO anisotropic measurements (α⊥, α∥, and related
      compression variables).
    filename: BAO_consensus_boss_dr12.json
    expected_files:
      - BAO_consensus_boss_dr12.json
  bao_eBOSS:
    url: https://data.sdss.org/sas/dr16/eboss/papers/clustering/eBOSS_LRG_bao_consensus.json
    notes: eBOSS LRG BAO consensus measurements.
    filename: eBOSS_LRG_bao_consensus.json
    expected_files:
      - eBOSS_LRG_bao_consensus.json
  cc_cosmic_chronometers_compilation:
    url: https://arxiv.org/src/1807.06209v3/anc/cosmic_chronometers.txt
    notes: Compilation of cosmic chronometer H(z) measurements.
    filename: cosmic_chronometers.txt
    expected_files:
      - cosmic_chronometers.txt
  pantheon_sn:
    url: https://github.com/dscolnic/Pantheon/archive/refs/heads/master.zip
    notes: Pantheon+ supernova compilation (CSV/covariance matrix).
    filename: Pantheon-master.zip
    expected_files:
      - Pantheon/data/Pantheon.dat
      - Pantheon/data/sys_full_long.txt
  planck_2018_raw:
    url: placeholder://planck_2018_raw
    raw_dir: COM_Likelihood_Data-baseline
    notes: >
      Planck 2018 baseline likelihood release (COM_Likelihood_Data-baseline).
      Final download URL will be provided later; for now ensure the COM_Likelihood_Data-baseline
      bundle is placed under data/raw/COM_Likelihood_Data-baseline before running conversions.
    filename: COM_Likelihood_Data-baseline.tar.gz
    expected_files:
      - plc_3.0/hi_l/plik/plik_rd12_HM_v22b_TTTEEE.clik
      - plc_3.0/low_l/commander/commander_dx12_v3_2_29.clik
      - plc_3.0/lensing/smicadx12_Dec5_ftl_mv2_ndclpp_p_teb_consext8.clik_lensing
  planck2018_distance_priors:
    url: https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_CosmoParams_R3.00.zip
    notes: Planck 2018 distance priors and derived parameters (R, l_A, θ_* from table VI).
    filename: COM_CosmoParams_R3.00.zip
    expected_files:
      - COM_PowerSpect_CMB_R3.00.zip
      - COM_CosmoParams_R3.00.pdf
  rsd_fsigma8_compilation:
    url: https://arxiv.org/src/1801.02656v3/anc/fsigma8_compilation.txt
    notes: Compilation of redshift-space distortion fσ₈ measurements.
    filename: fsigma8_compilation.txt
    expected_files:
      - fsigma8_compilation.txt
  weak_lensing_kids1000:
    url: https://kids.strw.leidenuniv.nl/DR4/data_files/KiDS1000_cosmic_shear_data_release.tgz
    notes: KiDS-1000 weak-lensing cosmic shear data release (tomographic ξ±, covariance, n(z)).
    filename: KiDS1000_cosmic_shear_data_release.tgz
    extract: true
    raw_dir: KiDS1000_cosmis_shear_data_release
    expected_files:
      - KiDS1000_cosmis_shear_data_release/data_fits/xipm_KIDS1000_BlindC_with_m_bias_V1.0.0A_ugriZYJHKs_photoz_SG_mask_LF_svn_309c_2Dbins_v2_goldclasses_Flag_SOM_Fid.fits
      - KiDS1000_cosmis_shear_data_release/chains_and_config_files/main_chains_iterative_covariance/xipm/config/pipeline.ini
